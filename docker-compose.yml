services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # /api/health is liveness only; rate limiting needs a reachable Redis, and a silently
    # unavailable limiter is far worse than waiting for it to come up.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://example.supabase.co}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-example-anon-key}
    container_name: fishfinder-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env.container
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://example.supabase.co}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-example-anon-key}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-example-service-role-key}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-llama-4-scout-17b-16e-instruct}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      NWS_BASE: ${NWS_BASE:-https://api.weather.gov}
      USGS_BASE: ${USGS_BASE:-https://api.waterdata.usgs.gov}
      OPEN_METEO_FORECAST: ${OPEN_METEO_FORECAST:-https://api.open-meteo.com/v1/forecast}
      OPEN_METEO_MARINE: ${OPEN_METEO_MARINE:-https://marine-api.open-meteo.com/v1/marine}
