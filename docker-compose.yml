services:
  ollama:
    image: ollama/ollama:latest
    container_name: fishfinder-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1 ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    container_name: fishfinder-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llama3.2-vision}
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        echo "Pulling text model: ${OLLAMA_MODEL}" &&
        ollama pull "${OLLAMA_MODEL}" &&
        echo "Pulling vision model: ${OLLAMA_VISION_MODEL}" &&
        ollama pull "${OLLAMA_VISION_MODEL}" &&
        echo "Ollama models are ready."

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fishfinder-app
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env.container
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://example.supabase.co}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-example-anon-key}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-example-service-role-key}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llama3.2-vision}
      NWS_BASE: ${NWS_BASE:-https://api.weather.gov}
      USGS_BASE: ${USGS_BASE:-https://api.waterdata.usgs.gov}
      OPEN_METEO_MARINE: ${OPEN_METEO_MARINE:-https://marine-api.open-meteo.com/v1/marine}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}

volumes:
  ollama_data:
