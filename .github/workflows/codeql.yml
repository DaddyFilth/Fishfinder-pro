name: "CodeQL Advanced"

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  check-default-setup:
    name: Check CodeQL setup mode
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: read
    outputs:
      run_advanced: ${{ steps.check.outputs.run_advanced }}
      skip_reason: ${{ steps.check.outputs.skip_reason }}
    steps:
      - name: Detect whether CodeQL default setup is enabled
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            try {
              const response = await github.request(
                "GET /repos/{owner}/{repo}/code-scanning/default-setup",
                { owner: context.repo.owner, repo: context.repo.repo },
              );
              const state = response.data?.state;

              if (state === "configured") {
                core.setOutput("run_advanced", "false");
                core.setOutput(
                  "skip_reason",
                  "CodeQL default setup is enabled; skipping advanced workflow to avoid SARIF processing conflicts.",
                );
              } else if (state === "not-configured") {
                core.setOutput("run_advanced", "true");
                core.setOutput("skip_reason", "");
              } else {
                core.setOutput("run_advanced", "false");
                core.setOutput(
                  "skip_reason",
                  `Received unexpected default setup state '${state}'; skipping advanced workflow.`,
                );
              }
            } catch (error) {
              if (error.status === 404) {
                core.setOutput("run_advanced", "true");
                core.setOutput("skip_reason", "");
              } else {
                core.setOutput("run_advanced", "false");
                core.setOutput(
                  "skip_reason",
                  `Unable to determine CodeQL default setup state (status: ${error.status ?? "unknown"}); skipping advanced workflow to avoid potential SARIF conflicts.`,
                );
                core.warning(error.message);
              }
            }

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: check-default-setup
    if: needs.check-default-setup.outputs.run_advanced == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python", "actions"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  advanced-disabled:
    name: Advanced CodeQL disabled by default setup
    needs: check-default-setup
    if: needs.check-default-setup.outputs.run_advanced != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ needs.check-default-setup.outputs.skip_reason }}"
