name: AI route smoke tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Ollama configuration
        run: |
          test -n "$OLLAMA_BASE_URL" || {
            echo "::error::Set the OLLAMA_BASE_URL Actions secret before running this workflow."
            exit 1
          }
          OLLAMA_HOST="${OLLAMA_BASE_URL%/}"
          OLLAMA_HOST="${OLLAMA_HOST%/v1}"
          curl --fail --silent --show-error --max-time 15 \
            "$OLLAMA_HOST/api/tags" > /dev/null

      - name: Install dependencies
        run: npm ci

      - name: Start application
        run: |
          npm run build
          npm start > /tmp/fishfinder.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/fishfinder.log
          exit 1

      - name: Smoke test AI routes
        run: |
          curl --fail --silent --show-error --max-time 60 \
            --header 'Content-Type: application/json' \
            --data '{"species":"Largemouth Bass","lat":40,"lng":-90,"water_temp_c":20,"pressure_hpa":1013,"wind_speed_ms":2,"dissolved_oxygen_mgl":8,"solunar_score":70,"moon_phase":"Full Moon"}' \
            http://127.0.0.1:3000/api/ai/bite-times > /dev/null
          curl --fail --silent --show-error --max-time 60 \
            --header 'Content-Type: application/json' \
            --data '{"spots":[{"id":"smoke-test","name":"Test Lake","lat":40,"lng":-90,"water_type":"freshwater","spot_type":"lake"}],"userLat":40,"userLng":-90}' \
            http://127.0.0.1:3000/api/ai/suggest-spots > /dev/null
          curl --fail --silent --show-error --max-time 60 \
            --header 'Content-Type: application/json' \
            --data '{"image_base64":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/ScLq7wAAAABJRU5ErkJggg=="}' \
            http://127.0.0.1:3000/api/ai/identify > /dev/null
