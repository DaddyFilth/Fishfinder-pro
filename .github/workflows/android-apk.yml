name: Build Android Debug APK

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Where to build the APK'
        type: choice
        default: self-hosted
        options:
          - self-hosted
          - github-hosted
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    # Self-hosted by default: self-hosted runners are never metered, so billing
    # or a spent Actions quota cannot block an APK build. Manual runs honour the
    # `runner` input; pull requests use a GitHub-hosted runner because those
    # minutes are free for public repositories.
    #
    # Force every run (including pull requests) onto your own hardware with:
    #   gh variable set ANDROID_RUNNER_JSON --body '["self-hosted","linux","x64"]'
    # Move everything back to GitHub-hosted runners with:
    #   gh variable set ANDROID_RUNNER_JSON --body '["ubuntu-latest"]'
    #
    # Prefer no CI at all? bash scripts/build-android-apk.sh
    runs-on: ${{ fromJSON(vars.ANDROID_RUNNER_JSON || (inputs.runner == 'github-hosted' && '["ubuntu-latest"]' || (github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","linux","x64"]'))) }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Generate Android launcher icons from SVG
        run: |
          npx @capacitor/assets generate --android --iconBackgroundColor "#0a192f"

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fishfinder-pro-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
