name: Android Readiness Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-web-app:
    name: Validate web and API application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Reject automatic or advanced CodeQL workflow configuration
        run: |
          if [ ! -e .github/workflows/codeql.yml ]; then
            exit 0
          fi

          node <<'NODE'
          const { readFileSync } = require('node:fs');

          function inspectWorkflow(source) {
            const topLevelKeys = new Set();
            const triggerNames = new Set();
            let inOnBlock = false;
            let onIndent = -1;
            let onChildIndent = null;

            for (const rawLine of source.split(/\r?\n/)) {
              const line = rawLine.replace(/\t/g, '    ');
              const trimmed = line.trim();

              if (!trimmed || trimmed.startsWith('#')) {
                continue;
              }

              const indent = line.match(/^ */)[0].length;

              if (inOnBlock && indent <= onIndent) {
                inOnBlock = false;
                onIndent = -1;
                onChildIndent = null;
              }

              if (!inOnBlock && indent === 0) {
                const topLevelMatch = line.match(/^([A-Za-z0-9_-]+):(?:\s*(.+))?$/);

                if (!topLevelMatch) {
                  continue;
                }

                const [, key, value = ''] = topLevelMatch;
                topLevelKeys.add(key);

                if (key !== 'on') {
                  continue;
                }

                if (value.startsWith('[') && value.endsWith(']')) {
                  for (const event of value.slice(1, -1).split(',')) {
                    const normalized = event.trim();
                    if (normalized) {
                      triggerNames.add(normalized);
                    }
                  }
                  continue;
                }

                if (value) {
                  triggerNames.add(value.trim());
                  continue;
                }

                inOnBlock = true;
                onIndent = indent;
                continue;
              }

              if (!inOnBlock) {
                continue;
              }

              if (onChildIndent === null) {
                onChildIndent = indent;
              }

              if (indent !== onChildIndent) {
                continue;
              }

              const triggerMatch = line.match(/^(\s*)([A-Za-z0-9_-]+):(?:\s*(.+))?$/);
              if (triggerMatch) {
                triggerNames.add(triggerMatch[2]);
              }
            }

            return {
              topLevelKeys: [...topLevelKeys],
              triggerNames: [...triggerNames],
            };
          }

          const workflow = inspectWorkflow(readFileSync('.github/workflows/codeql.yml', 'utf8'));
          const automaticTriggers = workflow.triggerNames.filter((name) => name !== 'workflow_dispatch');
          const extraKeys = workflow.topLevelKeys.filter((name) => !['name', 'on'].includes(name));
          const reasons = [];

          if (automaticTriggers.length > 0) {
            reasons.push(`automatic triggers: ${automaticTriggers.join(', ')}`);
          }

          if (
            workflow.triggerNames.length !== 1 ||
            workflow.triggerNames[0] !== 'workflow_dispatch'
          ) {
            reasons.push('trigger set is not manual-only workflow_dispatch');
          }

          if (extraKeys.length > 0) {
            reasons.push(`advanced configuration keys: ${extraKeys.join(', ')}`);
          }

          if (reasons.length > 0) {
            console.error(
              'Forbidden CodeQL workflow configuration in .github/workflows/codeql.yml (' +
                `${reasons.join('; ')}). Only a manual workflow_dispatch placeholder is allowed.`,
            );
            process.exit(1);
          }
          NODE

      - name: Build Next.js application
        run: npm run build
