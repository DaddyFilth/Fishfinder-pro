name: Android Readiness Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-web-app:
    name: Validate web and API application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Guard against advanced CodeQL workflow
        run: |
          python - <<'PY'
          import os
          import sys
          import yaml

          path = ".github/workflows/codeql.yml"
          if not os.path.exists(path):
              raise SystemExit(0)

          with open(path, encoding="utf-8") as file:
              docs = list(yaml.safe_load_all(file))

          if len(docs) != 1:
              print("::error::Forbidden CodeQL workflow configuration detected in .github/workflows/codeql.yml.")
              print("::error::Only a single-document manual workflow_dispatch placeholder without jobs is allowed.")
              raise SystemExit(1)

          workflow = docs[0] if isinstance(docs[0], dict) else {}
          if not isinstance(workflow, dict):
              print("::error::Forbidden CodeQL workflow configuration detected in .github/workflows/codeql.yml.")
              print("::error::Only a manual workflow_dispatch placeholder without jobs is allowed.")
              raise SystemExit(1)

          on_value = workflow["on"] if "on" in workflow else workflow.get(True)
          is_manual_only = (
              on_value == "workflow_dispatch"
              or (isinstance(on_value, list) and set(on_value) == {"workflow_dispatch"})
              or (isinstance(on_value, dict) and set(on_value.keys()) == {"workflow_dispatch"})
          )

          if "jobs" in workflow or not is_manual_only:
              print("::error::Forbidden CodeQL workflow configuration detected in .github/workflows/codeql.yml.")
              print("::error::Only a manual workflow_dispatch placeholder without jobs is allowed.")
              raise SystemExit(1)
          PY

      - name: Run tests
        run: npm test

      - name: Build Next.js application
        run: npm run build
