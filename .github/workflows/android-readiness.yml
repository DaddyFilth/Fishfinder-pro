name: Android Readiness Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-web-app:
    name: Validate web and API application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Guard against advanced CodeQL workflow
        run: |
          if [ -f .github/workflows/codeql.yml ] && {
            grep -Eq '^[[:space:]]*(push|pull_request|pull_request_target|schedule|workflow_run|workflow_call|repository_dispatch|merge_group):' .github/workflows/codeql.yml ||
            grep -Eq '^[[:space:]]*jobs:' .github/workflows/codeql.yml;
          }; then
            echo "Forbidden CodeQL workflow configuration detected in .github/workflows/codeql.yml."
            echo "Only a manual workflow_dispatch placeholder without jobs is allowed."
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Build Next.js application
        run: npm run build
