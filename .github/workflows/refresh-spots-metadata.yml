name: Refresh spots metadata

# Weekly refresh: scrape ODWC/USACE public-water metadata, push it to the spots
# worker, and re-enrich stored Supabase spot rows from the bundled catalog.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: refresh-spots-metadata
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
      CLOUDFLARE_WORKER_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scrape ODWC accessible fishing
        if: env.CLOUDFLARE_WORKER_URL != ''
        run: npm run scrape:odwc
        continue-on-error: true
      - name: Scrape USACE Tulsa District lakes
        if: env.CLOUDFLARE_WORKER_URL != ''
        run: npm run scrape:usace
        continue-on-error: true
      - name: Enrich stored spots from catalog
        if: env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npx tsx scripts/enrich-spots-from-catalog.ts
