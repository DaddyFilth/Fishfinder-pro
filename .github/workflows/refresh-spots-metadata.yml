name: Refresh spots metadata

# Weekly refresh: scrape ODWC/USACE public-water metadata, push it to Supabase, and re-enrich stored Supabase spot rows from the bundled catalog.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: refresh-spots-metadata
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for scrapers
        if: env.SUPABASE_SECRET_KEY != ''
        run: npx playwright-core install --with-deps chromium
      - name: Scrape ODWC accessible fishing
        if: env.SUPABASE_SECRET_KEY != ''
        run: npm run scrape:odwc -- --push
        continue-on-error: true
      - name: Scrape USACE Tulsa District lakes
        if: env.SUPABASE_SECRET_KEY != ''
        run: npm run scrape:usace -- --push
        continue-on-error: true
      - name: Enrich stored spots from catalog
        if: env.SUPABASE_SECRET_KEY != ''
        run: npx tsx scripts/enrich-spots-from-catalog.ts
