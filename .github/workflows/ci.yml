name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # CodeQL default setup is enabled for this repository. A committed
      # advanced CodeQL workflow would be rejected by GitHub, so the shared
      # guard script keeps the placeholder rule in one tested place.
      - name: Ensure advanced CodeQL workflow path is not used
        run: node scripts/checkCodeqlWorkflowPlaceholder.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build app
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: example-anon-key
          REDIS_URL: redis://localhost:6379
          NWS_BASE: https://api.weather.gov
          USGS_BASE: https://api.waterdata.usgs.gov
          OPEN_METEO_MARINE: https://marine-api.open-meteo.com/v1/marine
        run: npm run build

      - name: Smoke test production app
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: example-anon-key
          REDIS_URL: redis://localhost:6379
          NWS_BASE: https://api.weather.gov
          USGS_BASE: https://api.waterdata.usgs.gov
          OPEN_METEO_MARINE: https://marine-api.open-meteo.com/v1/marine
        run: npm run smoke
