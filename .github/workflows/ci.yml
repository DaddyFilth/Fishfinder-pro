name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: example-anon-key
      SUPABASE_SERVICE_ROLE_KEY: example-service-role-key
      OLLAMA_BASE_URL: http://localhost:11434/v1
      OLLAMA_MODEL: llama3.1
      OLLAMA_VISION_MODEL: llama3.2-vision
      NWS_BASE: https://api.weather.gov
      USGS_BASE: https://api.waterdata.usgs.gov
      OPEN_METEO_MARINE: https://marine-api.open-meteo.com/v1/marine

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure advanced CodeQL workflow path is not used
        run: |
          if [ -f .github/workflows/codeql.yml ] && {
            grep -Eq '^[[:space:]]*(push|pull_request|pull_request_target|schedule|workflow_run|workflow_call|repository_dispatch|merge_group):' .github/workflows/codeql.yml ||
            grep -Eq '^[[:space:]]*jobs:' .github/workflows/codeql.yml;
          }; then
            echo "::error::Forbidden CodeQL workflow configuration detected in .github/workflows/codeql.yml."
            echo "::error::Only a manual workflow_dispatch placeholder without jobs is allowed."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build app
        run: npm run build
