name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: example-anon-key
      SUPABASE_SERVICE_ROLE_KEY: example-service-role-key
      OLLAMA_BASE_URL: http://localhost:11434/v1
      OLLAMA_MODEL: llama3.1
      OLLAMA_VISION_MODEL: llama3.2-vision
      NWS_BASE: https://api.weather.gov
      USGS_BASE: https://api.waterdata.usgs.gov
      OPEN_METEO_MARINE: https://marine-api.open-meteo.com/v1/marine

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure advanced CodeQL workflow path is not used
        run: |
          python - <<'PY'
          import os
          import sys
          import yaml

          path = ".github/workflows/codeql.yml"
          if not os.path.exists(path):
              raise SystemExit(0)

          try:
              with open(path, encoding="utf-8") as file:
                  docs = list(yaml.safe_load_all(file))
          except yaml.YAMLError:
              print("::error::Forbidden CodeQL workflow configuration detected in .github/workflows/codeql.yml.")
              print("::error::Only a manual workflow_dispatch placeholder without jobs is allowed.")
              raise SystemExit(1)

          if len(docs) != 1:
              print("::error::Forbidden CodeQL workflow configuration detected in .github/workflows/codeql.yml.")
              print("::error::Only a single-document manual workflow_dispatch placeholder without jobs is allowed.")
              raise SystemExit(1)

          workflow = docs[0] if isinstance(docs[0], dict) else {}
          if not isinstance(workflow, dict):
              print("::error::Forbidden CodeQL workflow configuration detected in .github/workflows/codeql.yml.")
              print("::error::Only a manual workflow_dispatch placeholder without jobs is allowed.")
              raise SystemExit(1)

          on_value = workflow["on"] if "on" in workflow else workflow.get(True)
          is_manual_only = (
              on_value == "workflow_dispatch"
              or (isinstance(on_value, list) and set(on_value) == {"workflow_dispatch"})
              or (isinstance(on_value, dict) and set(on_value.keys()) == {"workflow_dispatch"})
          )

          if "jobs" in workflow or not is_manual_only:
              print("::error::Forbidden CodeQL workflow configuration detected in .github/workflows/codeql.yml.")
              print("::error::Only a manual workflow_dispatch placeholder without jobs is allowed.")
              raise SystemExit(1)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build app
        run: npm run build
