name: Contrast Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "25 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  contrast-scan:
    runs-on: ubuntu-latest
    env:
      CONTRAST_API_KEY: ${{ secrets.CONTRAST_API_KEY }}
      CONTRAST_ORGANIZATION_ID: ${{ secrets.CONTRAST_ORGANIZATION_ID }}
      CONTRAST_AUTH_HEADER: ${{ secrets.CONTRAST_AUTH_HEADER }}
      CONTRAST_ARTIFACT_PATH: ${{ vars.CONTRAST_ARTIFACT_PATH }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Skip when Contrast configuration is missing
        if: env.CONTRAST_API_KEY == '' || env.CONTRAST_ORGANIZATION_ID == '' || env.CONTRAST_AUTH_HEADER == '' || env.CONTRAST_ARTIFACT_PATH == ''
        run: echo 'Skipping Contrast scan because required Contrast secrets or CONTRAST_ARTIFACT_PATH are not configured.'

      - name: Contrast Scan Action
        id: contrast_scan
        if: env.CONTRAST_API_KEY != '' && env.CONTRAST_ORGANIZATION_ID != '' && env.CONTRAST_AUTH_HEADER != '' && env.CONTRAST_ARTIFACT_PATH != ''
        uses: Contrast-Security-OSS/contrastscan-action@339c87f4614b05aae7373929c56573c1bf362c02
        with:
          artifact: ${{ env.CONTRAST_ARTIFACT_PATH }}
          apiKey: ${{ env.CONTRAST_API_KEY }}
          orgId: ${{ env.CONTRAST_ORGANIZATION_ID }}
          authHeader: ${{ env.CONTRAST_AUTH_HEADER }}

      - name: Upload SARIF file
        if: env.CONTRAST_API_KEY != '' && env.CONTRAST_ORGANIZATION_ID != '' && env.CONTRAST_AUTH_HEADER != '' && env.CONTRAST_ARTIFACT_PATH != '' && steps.contrast_scan.outcome == 'success' && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
